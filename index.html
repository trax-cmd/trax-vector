<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TRAX: VECTOR</title>
<meta name="description" content="THE WAR. Fifty outposts on one open field; every outpost you hold builds its own army and the armies march on their own. You fly four battleships with two powers each and say where the reinforcements go.">
<style>
  :root {
    --west: #12A7C8; --west-edge: #7FF3FF; --east: #C8321E; --east-edge: #FFB07A; --gold: #FFD76A; --ink: #DFE8FF; --dim: #8A94AD;
    --chrome: rgba(6, 8, 14, 0.92); --line: #2A3352; --mono: ui-monospace, Menlo, Consolas, "Roboto Mono", monospace;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  html, body { margin: 0; height: 100%; background: #05060D; color: var(--ink); font: 12px var(--mono); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #strip { position: fixed; top: 0; left: 0; right: 0; z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 36px; padding: var(--sat) calc(10px + var(--sar)) 0 calc(10px + var(--sal)); background: var(--chrome); border-bottom: 1px solid var(--line); font-weight: 800; letter-spacing: .08em; }
  #strip b.w { color: var(--west-edge); } #strip b.e { color: var(--east-edge); }
  #clock { font-size: 14px; }
  #menu { display: flex; gap: 6px; }
  #menu button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 11px; letter-spacing: .06em; }
  #tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; gap: 8px; align-items: stretch; padding: 6px calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal)); background: var(--chrome); border-top: 1px solid var(--line); }
  #tray .ships { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; flex: 1.4; }
  #tray .ship { display: flex; flex-direction: column; justify-content: center; gap: 3px; min-height: 52px; padding: 4px 6px; background: rgba(18, 167, 200, .06); border: 1px solid var(--line); border-radius: 8px; text-align: left; }
  #tray .ship b { font-size: 11px; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tray .ship i { display: block; height: 6px; border-radius: 3px; background: #1A2138; overflow: hidden; } #tray .ship span { display: block; height: 100%; background: var(--west); }
  #tray .ship em { font-style: normal; font-size: 10px; color: var(--dim); }
  #tray .ship.sel { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); } #tray .ship.sel em { color: var(--gold); }
  #tray .ship.down { opacity: .5; }
  #tray .powers { display: flex; gap: 6px; flex: 1.2; }
  #tray .pw { --p: 1; flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 52px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: #0B0F1C; text-align: left; }
  #tray .pw::before { content: ''; position: absolute; left: 0; bottom: 0; height: 3px; width: calc(var(--p) * 100%); background: var(--gold); }
  #tray .pw b { font-size: 12px; letter-spacing: .05em; } #tray .pw i { font-style: normal; font-size: 10px; color: var(--dim); }
  #tray .pw.ready { border-color: var(--gold); background: rgba(255, 215, 106, .1); } #tray .pw.ready b { color: var(--gold); }
  #tray .auto { width: 58px; border: 1px solid var(--line); border-radius: 8px; background: #0B0F1C; font-size: 11px; letter-spacing: .06em; }
  #tray .auto.on { border-color: var(--west-edge); color: var(--west-edge); }
  #tray .rally { flex: 0.7; display: flex; flex-direction: column; justify-content: center; gap: 3px; position: relative; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  #tray .rally b { font-size: 11px; color: var(--gold); letter-spacing: .08em; } #tray .rally em { font-style: normal; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tray .rally .off { position: absolute; top: 2px; right: 4px; background: none; border: 0; font-size: 16px; color: var(--dim); }
  @media (max-width: 760px) { #tray { flex-wrap: wrap; } #tray .ships { flex: 1 1 100%; } #tray .ship { min-height: 40px; } #tray .powers { flex: 1 1 60%; } #tray .pw { min-height: 42px; } #tray .rally { flex: 1 1 30%; } }
  #minimap { position: fixed; z-index: 3; border: 1px solid var(--line); border-radius: 4px; box-sizing: border-box; }
  #plate { position: fixed; left: 50%; top: 56px; z-index: 6; transform: translateX(-50%); max-width: 90vw; padding: 8px 16px; border-radius: 8px; background: rgba(6, 8, 14, .9); font-size: 15px; font-weight: 800; letter-spacing: .14em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .15s; pointer-events: none; }
  #plate.on { opacity: 1; } #plate.t0 { color: var(--west-edge); } #plate.t1 { color: var(--east-edge); }
  #end { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(5, 6, 13, .82); }
  #end.on { display: flex; } #endword { font-size: 40px; font-weight: 800; letter-spacing: .2em; color: var(--gold); } #endwhy { color: var(--dim); letter-spacing: .08em; }
  #again { padding: 10px 24px; border: 1px solid var(--gold); border-radius: 8px; background: rgba(255, 215, 106, .1); color: var(--gold); font-weight: 800; letter-spacing: .12em; }
  #nogl { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; } #nogl.on { display: flex; }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="strip"><span id="score"></span><span id="clock">12:00</span><span id="armies"></span><span id="menu"><button id="sound" type="button">SOUND ON</button><a href="breach.html" style="display:none">old</a></span></div>
<div id="minimap"></div>
<div id="plate"></div>
<div id="tray"></div>
<div id="end"><div id="endword"></div><div id="endwhy"></div><button id="again" type="button">AGAIN</button></div>
<div id="nogl">This war needs WebGL2.</div>
<script type="module" src="src/war/main.js"></script>
</body>
</html>
